syntax = "proto3";

package communication.v1;

option go_package = "github.com/toxicbishop/kssem-college-erp-system/proto/communication/v1;communicationv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service CommunicationService {
  rpc GetNotifications(GetNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http) = {
      get: "/api/communication/notifications"
      additional_bindings {
        get: "/api/communication/notifications/{user_id}"
      }
    };
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/communication/notifications/{id}/read"
    };
  }

  rpc SendChatMessage(SendChatMessageRequest) returns (ChatMessage) {
    option (google.api.http) = {
      post: "/api/communication/chat/{classroom_id}/messages"
      body: "*"
    };
  }

  rpc GetChatMessages(GetChatMessagesRequest) returns (ListChatMessagesResponse) {
    option (google.api.http) = {
      get: "/api/communication/chat/{classroom_id}/messages"
    };
  }

  // The API gateway adapts this gRPC server stream to text/event-stream.
  rpc StreamChatMessages(StreamChatMessagesRequest) returns (stream ChatMessage) {}
}

// ---------------------------------------------------------
// Messages
// ---------------------------------------------------------

message GetNotificationsRequest {
  string user_id = 1;
}

message MarkNotificationReadRequest {
  string id = 1;
}

message Notification {
  string id = 1;
  string title = 2;
  string message = 3;
  string type = 4;
  string timestamp = 5;
  bool read = 6;
  string link = 7;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message ChatMessage {
  string id = 1;
  string classroom_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string text = 5;
  string timestamp = 6;
}

message SendChatMessageRequest {
  string classroom_id = 1;
  string text = 2;
}

message GetChatMessagesRequest {
  string classroom_id = 1;
  int32 limit = 2;
}

message ListChatMessagesResponse {
  repeated ChatMessage messages = 1;
}

message StreamChatMessagesRequest {
  string classroom_id = 1;
}
