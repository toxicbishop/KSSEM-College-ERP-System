syntax = "proto3";

package admin.v1;

option go_package = "github.com/toxicbishop/kssem-college-erp-system/proto/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service AdminService {
  rpc GetAllUsers(google.protobuf.Empty) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/admin/users"
    };
  }

  rpc CreateManagedUser(CreateManagedUserRequest) returns (CreateManagedUserResponse) {
    option (google.api.http) = {
      post: "/api/admin/users"
      body: "*"
    };
  }

  rpc UpdateManagedUser(UpdateManagedUserRequest) returns (UpdateManagedUserResponse) {
    option (google.api.http) = {
      patch: "/api/admin/users/{uid}"
      body: "profile"
    };
  }

  rpc DeleteManagedUser(DeleteManagedUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/admin/users/{uid}"
    };
  }

  rpc GetAuditLogs(google.protobuf.Empty) returns (ListAuditLogsResponse) {
    option (google.api.http) = {
      get: "/api/admin/audit-logs"
    };
  }

  rpc GetSystemSettings(google.protobuf.Empty) returns (SystemSettings) {
    option (google.api.http) = {
      get: "/api/admin/settings"
    };
  }

  rpc UpdateSystemSettings(UpdateSystemSettingsRequest) returns (SystemSettings) {
    option (google.api.http) = {
      patch: "/api/admin/settings"
      body: "settings"
    };
  }

  // Profile Change Request RPCs — migrated from Next.js server actions to the Admin microservice
  rpc CreateProfileChangeRequest(CreateProfileChangeRequestRequest) returns (CreateProfileChangeRequestResponse) {
    option (google.api.http) = {
      post: "/api/admin/profile-change-requests"
      body: "*"
    };
  }

  rpc GetProfileChangeRequests(google.protobuf.Empty) returns (ListProfileChangeRequestsResponse) {
    option (google.api.http) = {
      get: "/api/admin/profile-change-requests"
    };
  }

  rpc ApproveProfileChangeRequest(ApproveProfileChangeRequestRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/admin/profile-change-requests/{request_id}/approve"
      body: "*"
    };
  }

  rpc DenyProfileChangeRequest(DenyProfileChangeRequestRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/admin/profile-change-requests/{request_id}/deny"
      body: "*"
    };
  }
}

// ---------------------------------------------------------
// Messages
// ---------------------------------------------------------

message UserData {
  string uid = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string profile_photo_url = 5;
  string department = 6;
  string date_of_birth = 7;
  string contact_number = 8;
}

message ListUsersResponse {
  repeated UserData users = 1;
}

message CreateManagedUserRequest {
  UserData profile = 1;
  string temporary_password = 2;
}

message CreateManagedUserResponse {
  string uid = 1;
  bool auth_user_created = 2;
}

message UpdateManagedUserRequest {
  string uid = 1;
  UserData profile = 2;
}

message UpdateManagedUserResponse {
  UserData profile = 1;
}

message DeleteManagedUserRequest {
  string uid = 1;
}

message AuditLog {
  string id = 1;
  string action = 2;
  string entity = 3;
  string entity_id = 4;
  string performed_by = 5;
  string performed_by_name = 6;
  string timestamp = 7;
  string details = 8;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
}

message NotificationSettings {
  bool email_notifications = 1;
  bool sms_notifications = 2;
  bool exam_alerts = 3;
  bool attendance_alerts = 4;
}

message SystemSettings {
  string institution_name = 1;
  string academic_year = 2;
  string current_semester = 3;
  bool maintenance_mode = 4;
  string timezone = 5;
  NotificationSettings notification_settings = 6;
}

message UpdateSystemSettingsRequest {
  SystemSettings settings = 1;
}

// ---------------------------------------------------------
// Profile Change Request Messages
// ---------------------------------------------------------

message ProfileChangeRequest {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string user_email = 4;
  string field_name = 5;
  string old_value = 6;
  string new_value = 7;
  string requested_at = 8;
  string status = 9;       // "pending" | "approved" | "denied"
  string admin_notes = 10;
  string resolved_at = 11;
}

message CreateProfileChangeRequestRequest {
  string user_id = 1;           // from gateway X-User-Id header
  string field_name = 2;
  string old_value = 3;
  string new_value = 4;
}

message CreateProfileChangeRequestResponse {
  string id = 1;
}

message ListProfileChangeRequestsResponse {
  repeated ProfileChangeRequest requests = 1;
}

message ApproveProfileChangeRequestRequest {
  string request_id = 1;
  string admin_notes = 2;
  string new_value = 3;  // confirmation of the new value
}

message DenyProfileChangeRequestRequest {
  string request_id = 1;
  string admin_notes = 2;
}
